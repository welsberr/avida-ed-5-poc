<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1e2e">
  <title>Avida 5 — Digital Evolution Research Platform</title>
  <script src="coi-serviceworker.js"></script>
  <link rel="stylesheet" href="Avida.css">
</head>
<body>
  <noscript>Avida requires JavaScript and WebAssembly.</noscript>
  <main id="emp_base"></main>
  <script src="vendor/plotly-1.53.0.min.js"></script>
  <script src="education-plots.js"></script>
  <script>
    const startupRoot = document.getElementById("emp_base");
    const showStartupError = message => {
      if (startupRoot.children.length) return;
      const warning = document.createElement("section");
      warning.className = "startup-warning";
      warning.setAttribute("role", "alert");
      const heading = document.createElement("h1");
      heading.textContent = "Avida could not start";
      const details = document.createElement("p");
      details.textContent = message;
      warning.append(heading, details);
      startupRoot.append(warning);
    };
    window.addEventListener("error", event => showStartupError(event.message));
    window.addEventListener("unhandledrejection", event => {
      showStartupError(String(event.reason || "Avida initialization failed."));
    });
    if (!window.crossOriginIsolated || typeof SharedArrayBuffer === "undefined") {
      startupRoot.innerHTML = `
        <section class="startup-warning" role="alert">
          <h1>Avida needs cross-origin isolation</h1>
          <p>This browser has not enabled the shared memory used by the simulation worker.
          On GitHub Pages, reload once to let the local service worker set the required
          security policy. The app also needs a secure browser context and service-worker
          support.</p>
          <p>For local use, build with <code>make web</code> and run <code>make server</code>.
          Open the address printed by the server.</p>
        </section>`;
    } else {
      const script = document.createElement("script");
      const population = new URLSearchParams(window.location.search).get("population");
      script.src = population === "well-mixed" ? "Avida-well-mixed.js" : "Avida.js";
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
