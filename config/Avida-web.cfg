# Canonical configuration for Avida's WebAssembly build.
#
# source/Avida-web.cpp loads this file for every new web run. Adjust the
# values here to change the defaults served by the web interface.

AvidaGP {
  # Offspring genome size must be within this factor of the parent's
  # (2.0 = half to double); divides outside the range fail.
  offspring_size_range = 2;

  # Number of CPU cycles printed by the trace command.
  trace_cycles = 200;
}

base {
  # Filename for the initial ancestor, relative to config_dir.
  ancestor_filename = "ancestor.org";

  # WebAssembly virtual filesystem locations populated by the web build.
  config_dir = "/config";
  data_dir = "/data";

  # Maximum number of updates to run (0 means no limit).
  max_updates = 0;

  # Main random number seed (0 requests the default randomized seed behavior).
  random_seed = 0;
}

grid {
  # Number of rows and columns in the population grid.
  height = 100;
  width = 100;
}

mutations {
  # Per-site substitution probability.
  substitution_prob = 0.01;
}

# The nine rewarded tasks and strengths mirror the Avida-ED 4 default workspace
# (source revision fcfc5c6). The legacy ORN and ANDN tasks map to OR_NOT/AND_NOT.
# Avida-ED 4 applies these as energy rewards; this POC applies the same factors to
# metabolic_mult, so the values align while their engine-level effects remain distinct.
Reaction NOT     metabolic_mult mult 2.0 1
Reaction NAND    metabolic_mult mult 2.0 1
Reaction AND     metabolic_mult mult 4.0 1
Reaction OR_NOT  metabolic_mult mult 4.0 1
Reaction OR      metabolic_mult mult 8.0 1
Reaction AND_NOT metabolic_mult mult 8.0 1
Reaction NOR     metabolic_mult mult 16.0 1
Reaction XOR     metabolic_mult mult 16.0 1
Reaction EQU     metabolic_mult mult 32.0 1

# Let the web interface retain the live population and return control to the user.
on update 10000 pause
