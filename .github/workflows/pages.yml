name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the Emscripten app and assemble the site
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_roadmap.py
          python3 scripts/render_roadmap.py --check
          docker build --platform linux/amd64 --target web-build -t avida-ed-5-pages .
          mkdir -p _site/app
          container_id="$(docker create avida-ed-5-pages)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/src/Avida/web/." _site/app/
          cp index.html .nojekyll _site/
          cp docs/port-status.html docs/codex-collaboration.html docs/porting-learning-roadmap.html docs/roadmap.html docs/visual-audit-2026-09-30.html docs/site-report.css _site/
          cp -r docs/evidence _site/
          test -s _site/index.html
          test -s _site/port-status.html
          test -s _site/codex-collaboration.html
          test -s _site/porting-learning-roadmap.html
          test -s _site/roadmap.html
          test -s _site/visual-audit-2026-09-30.html
          test -s _site/evidence/visual-audit-2026-09-30/desktop-population.png
          test -s _site/evidence/visual-audit-2026-09-30/desktop-organism.png
          test -s _site/evidence/visual-audit-2026-09-30/narrow-organism.png
          test -s _site/evidence/visual-audit-2026-09-30/desktop-analysis.png
          test -s _site/evidence/visual-audit-2026-09-30/narrow-analysis.png
          test -s _site/evidence/visual-audit-2026-09-30/desktop-configure.png
          test -s _site/site-report.css
          test -s _site/app/Avida.js
          test -s _site/app/Avida.wasm
          test -s _site/app/Avida.data
          test -s _site/app/coi-serviceworker.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
